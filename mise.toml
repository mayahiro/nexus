[tasks.docs]
description = "Generate CLI reference from the command graph"
run = "go run ./internal/cmd/clidocs"

[tasks.format]
description = "Format and Import Optimization"
run = [
  "go fmt ./...",
  "find . -type f -name '*.go' -exec go tool goimports -w -local \"github.com/mayahiro/nexus\" {} +",
  "go vet ./...",
]
